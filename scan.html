<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>출석 스캔 — AMC</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/amc.css">
<style>
  main { padding: 16px 0 40px; }
  .top nav a { padding: 6px 8px; font-size: 13px; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="scan.html"><span class="mark">AMC</span>출석 <small data-user></small></a>
    <nav>
      <a href="dashboard.html">현황</a>
      <a href="admin.html">명단</a>
      <a href="#" data-logout>로그아웃</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="card wrap-narrow" id="gate" style="margin:0 auto">
      <h2>감독관 로그인</h2>
      <form class="form" id="login-form" style="margin-top:20px" novalidate>
        <div class="form-row"><label for="email">이메일</label><input class="input" id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="form-row"><label for="pw">비밀번호</label><input class="input" id="pw" name="pw" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-block" type="submit">로그인</button>
      </form>
      <div class="alert" id="gate-msg" hidden></div>
    </section>

    <div id="app" hidden class="scan-wrap">
      <div class="row row-between" style="margin-bottom:6px">
        <strong>담당 시험실</strong>
        <span class="hint" id="count"></span>
      </div>
      <div class="room-pick" id="rooms"></div>

      <div id="reader"></div>
      <p class="row" style="margin-top:10px;justify-content:center">
        <button class="btn btn-line btn-sm" id="cam-toggle">카메라 시작</button>
        <button class="btn btn-line btn-sm" id="cam-flip">카메라 전환</button>
      </p>

      <div class="scan-result" id="result" hidden></div>

      <div class="card" style="margin-top:20px;padding:18px">
        <h3 style="font-size:15px;margin-bottom:8px">QR 없이 수기 출석</h3>
        <input class="input" id="manual-q" placeholder="이름 또는 수험번호" autocomplete="off">
        <ul class="list" id="manual-list"></ul>
      </div>

      <div class="card" style="padding:18px">
        <h3 style="font-size:15px;margin-bottom:8px">최근 처리</h3>
        <ul class="list" id="recent"></ul>
      </div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var A = window.AMCApp, $ = A.$, $$ = A.$$, esc = A.esc, db = A.db;
  var students = {}, attendance = {}, settings = {}, room = localStorage.getItem("amc_room") || "", user;
  var scanner, running = false, facing = "environment", lastText = "", lastAt = 0;
  var beep;

  A.requireAdmin(function (u) {
    user = u;
    A.loadSettings().then(function (s) {
      settings = s;
      renderRooms();
    });
    db.collection("students").onSnapshot(function (snap) {
      students = {};
      snap.docs.forEach(function (d) { students[d.id] = d.data(); });
      renderCount();
    });
    db.collection("attendance").onSnapshot(function (snap) {
      attendance = {};
      snap.docs.forEach(function (d) { attendance[d.id] = d.data(); });
      renderCount(); renderRecent();
    });
    $("#cam-toggle").addEventListener("click", function () { running ? stopCam() : startCam(); });
    $("#cam-flip").addEventListener("click", function () { facing = facing === "environment" ? "user" : "environment"; if (running) stopCam().then(startCam); });
    $("#manual-q").addEventListener("input", renderManual);
    $("#manual-list").addEventListener("click", function (e) {
      var b = e.target.closest("[data-check]");
      if (b) checkIn(students[b.dataset.check], "manual");
    });
    startCam();
  });

  function renderRooms() {
    var rooms = settings.rooms && settings.rooms.length ? settings.rooms : [];
    var el = $("#rooms");
    el.innerHTML = ['<button aria-pressed="' + (room === "") + '" data-room="">전체</button>'].concat(rooms.map(function (r) {
      return '<button aria-pressed="' + (room === r) + '" data-room="' + esc(r) + '">' + esc(r) + "</button>";
    })).join("");
    $$("button", el).forEach(function (b) {
      b.addEventListener("click", function () {
        room = b.dataset.room; localStorage.setItem("amc_room", room);
        $$("button", el).forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
        renderCount();
      });
    });
  }
  function inRoom(s) { return !room || s.room === room; }
  function renderCount() {
    var all = Object.keys(students).filter(function (k) { return inRoom(students[k]); });
    var done = all.filter(function (k) { return attendance[k]; }).length;
    $("#count").textContent = "출석 " + done + " / " + all.length;
  }

  /* ---------- 카메라 ---------- */
  function startCam() {
    if (!window.Html5Qrcode) { showResult("err", "스캐너 라이브러리를 불러오지 못했습니다.", ""); return; }
    scanner = scanner || new Html5Qrcode("reader");
    var w = Math.min(window.innerWidth - 40, 440);
    return scanner.start({ facingMode: facing }, { fps: 10, qrbox: { width: Math.round(w * 0.7), height: Math.round(w * 0.7) } }, onScan, function () {})
      .then(function () { running = true; $("#cam-toggle").textContent = "카메라 정지"; })
      .catch(function (err) { showResult("err", "카메라를 열 수 없습니다", "브라우저 카메라 권한을 허용해 주세요. (" + err + ")"); });
  }
  function stopCam() {
    if (!scanner || !running) return Promise.resolve();
    return scanner.stop().then(function () { running = false; $("#cam-toggle").textContent = "카메라 시작"; });
  }
  function onScan(text) {
    var now = Date.now();
    if (text === lastText && now - lastAt < 4000) return;  /* 같은 QR 연속 인식 방지 */
    lastText = text; lastAt = now;
    var q = A.parseQr(text);
    if (!q) { showResult("err", "AMC 수험표 QR이 아닙니다", text.slice(0, 40)); return; }
    var s = students[q.examNo];
    if (!s) { showResult("err", "등록되지 않은 수험번호", q.examNo); return; }
    if (s.token !== q.token) { showResult("err", "수험표 확인 필요", q.examNo + " " + s.name + " — QR 코드가 명단과 맞지 않습니다. 수기 출석으로 처리하세요."); return; }
    checkIn(s, "qr");
  }

  /* ---------- 출석 처리 ---------- */
  function checkIn(s, method) {
    if (!s) return;
    var prev = attendance[s.examNo];
    if (prev) {
      showResult("dup", s.name + " · 이미 출석", s.examNo + " · " + (s.room || "") + " · " + A.fmtTime(prev.checkedAt) + " 처리됨");
      sound(2); return;
    }
    var warn = room && s.room && s.room !== room ? " ⚠ 배정 시험실은 " + s.room + " 입니다" : "";
    var rec = { examNo: s.examNo, name: s.name, grade: s.grade || "", room: s.room || "", scanRoom: room, method: method, by: user.email, checkedAt: firebase.firestore.FieldValue.serverTimestamp() };
    attendance[s.examNo] = Object.assign({}, rec, { checkedAt: new Date() });  /* 즉시 반영(오프라인 대비) */
    db.collection("attendance").doc(s.examNo).set(rec).catch(function (err) { console.error(err); });
    showResult(warn ? "dup" : "ok", s.name + " 출석", s.examNo + " · " + (s.grade || "") + " · " + (s.room || "") + warn + (method === "manual" ? " · 수기" : ""));
    sound(1); renderCount(); renderRecent(); renderManual();
    if (navigator.vibrate) navigator.vibrate(warn ? [80, 60, 80] : 80);
  }
  function showResult(tone, big, sub) {
    var r = $("#result");
    r.hidden = false; r.dataset.tone = tone;
    r.innerHTML = '<div class="big">' + esc(big) + '</div><div class="sub">' + esc(sub) + "</div>";
    if (tone === "err") sound(3);
  }
  function sound(kind) {
    try {
      beep = beep || new (window.AudioContext || window.webkitAudioContext)();
      var o = beep.createOscillator(), g = beep.createGain();
      o.connect(g); g.connect(beep.destination);
      o.frequency.value = kind === 1 ? 1200 : kind === 2 ? 700 : 300;
      g.gain.value = 0.15;
      o.start(); o.stop(beep.currentTime + (kind === 3 ? 0.35 : 0.12));
    } catch (e) {}
  }

  function renderRecent() {
    var list = Object.keys(attendance).map(function (k) { return attendance[k]; })
      .filter(function (a) { return a.by === user.email; })
      .sort(function (a, b) { return toMs(b.checkedAt) - toMs(a.checkedAt); }).slice(0, 8);
    $("#recent").innerHTML = list.map(function (a) {
      return "<li><span>" + esc(a.name) + ' <span class="meta">' + esc(a.examNo) + " · " + esc(a.room) + '</span></span><span class="meta">' + A.fmtTime(a.checkedAt) + (a.method === "manual" ? " 수기" : "") + "</span></li>";
    }).join("") || '<li class="meta">아직 없음</li>';
  }
  function toMs(ts) { return ts && ts.toDate ? ts.toDate().getTime() : (ts instanceof Date ? ts.getTime() : 0); }

  function renderManual() {
    var q = A.normName($("#manual-q").value).toLowerCase();
    var el = $("#manual-list");
    if (q.length < 2) { el.innerHTML = ""; return; }
    var hits = Object.keys(students).map(function (k) { return students[k]; }).filter(function (s) {
      return s.name.indexOf(q) !== -1 || s.examNo.indexOf(q) !== -1;
    }).slice(0, 8);
    el.innerHTML = hits.map(function (s) {
      var at = attendance[s.examNo];
      return "<li><span>" + esc(s.name) + ' <span class="meta">' + esc(s.examNo) + " · " + esc(s.grade) + " · " + esc(s.room) + "</span></span>" +
        (at ? '<span class="tag tag-ok">' + A.fmtTime(at.checkedAt) + "</span>" : '<button class="btn btn-sm" data-check="' + esc(s.examNo) + '">출석</button>') + "</li>";
    }).join("") || '<li class="meta">검색 결과 없음</li>';
  }
})();
</script>
</body>
</html>
